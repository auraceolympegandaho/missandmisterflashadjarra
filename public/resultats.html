<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Résultats — Miss & Mister Flash Adjarra</title>
<link rel="icon" href="/img/logo.jpg" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/nav.css" />
<link rel="stylesheet" href="/css/profile.css" />
<link rel="stylesheet" href="/css/resultats.css" />
</head>
<body>

<script src="/js/nav.js"></script>

<main class="profile-main" style="max-width:760px;">
  <h1 style="font-family:var(--font-display); color:var(--blue-dark); text-align:center; margin:6px 0 4px;">Classement en direct</h1>
  <p style="text-align:center; color:var(--text-muted); font-size:13px; margin:0 0 24px;">
    Mis à jour en temps réel, à chaque vote confirmé
  </p>

  <div class="results-block">
    <h2 class="results-cat-title">Miss</h2>
    <ol class="leaderboard" id="leaderboard-miss"></ol>
  </div>

  <div class="results-block">
    <h2 class="results-cat-title">Mister</h2>
    <ol class="leaderboard" id="leaderboard-mister"></ol>
  </div>

  <p id="empty-results" style="display:none; text-align:center; color:var(--text-muted);">
    Aucun candidat pour le moment.
  </p>
</main>

<footer>
  <p class="rights-line">Tous droits réservés Miss &amp; Mister FLASH ADJARRA.</p>
</footer>

<script src="/js/resultats.js"></script>
</body>
</html>
