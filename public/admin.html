<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Miss & Mister Flash Adjarra</title>
<link rel="icon" href="/img/logo.jpg" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

<!-- Ecran de connexion -->
<div id="login-screen" class="login-screen">
  <div class="login-box">
    <img src="/img/logo.jpg" alt="Miss & Mister Flash Adjarra" style="max-width:140px; width:100%; height:auto; display:block; margin:0 auto 14px;" />
    <h1>Panel admin</h1>
    <p class="sub">Miss &amp; Mister Flash Adjarra</p>
    <label>Identifiant</label>
    <input id="login-user" type="text" autocomplete="username" />
    <label>Mot de passe</label>
    <input id="login-pass" type="password" autocomplete="current-password" />
    <button class="btn block" id="login-btn">Se connecter</button>
    <p class="error-msg" id="login-error"></p>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard" class="dashboard" style="display:none;">
  <header class="admin-header">
    <div>
      <h1>Miss &amp; Mister Flash Adjarra</h1>
      <p>Panel administrateur</p>
    </div>
    <button class="btn" id="logout-btn">Déconnexion</button>
  </header>

  <nav class="admin-tabs">
    <button class="admin-tab-btn active" data-tab="results">Résultats</button>
    <button class="admin-tab-btn" data-tab="candidates">Candidats</button>
    <button class="admin-tab-btn" data-tab="transactions">Transactions</button>
    <button class="admin-tab-btn" data-tab="settings">Réglages</button>
  </nav>

  <section id="tab-results" class="tab-panel">
    <div class="stat-cards">
      <div class="stat-card">
        <span class="label">Total encaissé</span>
        <span class="value" id="stat-total-fcfa">0 FCFA</span>
      </div>
      <div class="stat-card">
        <span class="label">Transactions payées</span>
        <span class="value" id="stat-nb-tx">0</span>
      </div>
    </div>
    <table class="admin-table" id="results-table">
      <thead><tr><th>#</th><th>Candidat</th><th>Catégorie</th><th>Votes</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="tab-candidates" class="tab-panel" style="display:none;">
    <button class="btn gold" id="new-candidate-btn">+ Ajouter un(e) candidat(e)</button>
    <table class="admin-table" id="candidates-table">
      <thead><tr><th>Photo</th><th>N°</th><th>Nom</th><th>Catégorie</th><th>Votes</th><th>Statut</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="tab-transactions" class="tab-panel" style="display:none;">
    <table class="admin-table" id="transactions-table">
      <thead><tr><th>Date</th><th>Candidat</th><th>Votes</th><th>Montant</th><th>Téléphone</th><th>Statut</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="tab-settings" class="tab-panel" style="display:none;">
    <div class="form-card">
      <label>Prix d'un vote (FCFA)</label>
      <input type="number" id="price-input" min="1" />
      <button class="btn gold" id="save-price-btn">Enregistrer</button>
      <p class="error-msg" id="price-msg"></p>
    </div>
  </section>
</div>

<!-- Modal creation/edition candidat -->
<div class="overlay" id="candidate-overlay">
  <div class="modal">
    <h2 id="candidate-modal-title">Ajouter un(e) candidat(e)</h2>
    <label>Nom complet</label>
    <input type="text" id="c-name" />
    <label>Catégorie</label>
    <select id="c-category" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); font-size:15px;">
      <option value="Miss">Miss</option>
      <option value="Mister">Mister</option>
    </select>
    <label>Numéro de candidature</label>
    <input type="text" id="c-number" placeholder="ex : 12" />
    <label>Bio / présentation</label>
    <input type="text" id="c-bio" />
    <label>Projet / motivation</label>
    <textarea id="c-project" rows="3" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); font-size:15px; font-family:inherit; resize:vertical;"></textarea>
    <label>Photo</label>
    <input type="file" id="c-photo" accept="image/*" />
    <div style="margin-top:16px; display:flex; gap:10px;">
      <button class="btn gold block" id="save-candidate-btn">Enregistrer</button>
    </div>
    <p class="error-msg" id="candidate-msg"></p>
    <span class="close-link" id="close-candidate-modal">Annuler</span>
  </div>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
