<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Suivre ma candidature — Miss & Mister Flash Adjarra</title>
<link rel="icon" type="image/png" href="/img/favicon.png" />
<link rel="stylesheet" href="/css/atelier-core.css" />
<link rel="stylesheet" href="/css/atelier.css" />
</head>
<body>

<script src="/js/nav.js"></script>
<main class="reg-main" data-page="track">
  <section class="reg-hero">
    <p class="reg-eyebrow">Espace candidat(e)</p>
    <h1>Suivre ma <span>candidature</span></h1>
    <hr class="reg-rule" />
    <p class="reg-lead">Saisis la référence de candidature qui t'a été remise lors du dépôt de ton dossier.</p>
  </section>

  <div class="reg-card">
    <div class="reg-field">
      <label for="t-ref">Numéro de référence <span class="req">*</span></label>
      <input type="text" id="t-ref" placeholder="MMFA-2027-XXXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="20" />
    </div>
    <div id="t-alert" class="reg-alert" role="alert"></div>
    <button class="reg-btn" id="t-btn" type="button" style="width:100%">Consulter mon dossier</button>
  </div>

  <div id="t-result" class="reg-card" hidden></div>
</main>

<footer></footer>
<script src="/js/inscriptions.js"></script>
</body>
</html>
