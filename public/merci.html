<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Merci — Miss & Mister Flash Adjarra</title>

<link rel="icon" type="image/png" href="/img/favicon.png" />
<link rel="stylesheet" href="/css/atelier-core.css" />
<link rel="stylesheet" href="/css/atelier.css" />
</head>
<body>

<script src="/js/nav.js"></script>

<main class="page-main" style="text-align:center;">
  <div class="panel wide" style="justify-items:center;border-bottom:0;">
    <div id="status-box" class="merci-box" role="status">
      <p>Vérification de votre paiement...</p>
    </div>
    <a class="btn" href="/">Retour au site</a>
  </div>
</main>
<script>
const params = new URLSearchParams(window.location.search);
const txId = params.get("tx");
const box = document.getElementById("status-box");

async function checkStatus(attempt = 0) {
  if (!txId) {
    box.innerHTML = "<p>Référence de transaction manquante.</p>";
    return;
  }
  try {
    const res = await fetch(`/api/votes/status/${txId}`);
    const data = await res.json();

    if (data.status === "approved") {
      box.innerHTML = `<p class="merci-ok">Paiement confirmé ! Merci, vos ${data.votes_bought} vote(s) ont été comptabilisés.</p>`;
    } else if (data.status === "declined" || data.status === "canceled") {
      box.innerHTML = `<p class="merci-ko">Le paiement n'a pas abouti. Vous pouvez réessayer depuis la page d'accueil.</p>`;
    } else if (attempt < 8) {
      // Le webhook FedaPay peut mettre quelques secondes à arriver : on réessaie.
      setTimeout(() => checkStatus(attempt + 1), 2000);
    } else {
      box.innerHTML = `<p>Paiement en cours de vérification. Si vos votes n'apparaissent pas d'ici quelques minutes, contactez l'organisateur.</p>`;
    }
  } catch (e) {
    box.innerHTML = "<p>Impossible de vérifier le statut du paiement.</p>";
  }
}
checkStatus();
</script>
<footer></footer>

</body>
</html>
