<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Les candidats — Miss & Mister Flash Adjarra</title>
<meta name="description" content="Découvrez et soutenez les candidat(e)s de Miss & Mister Flash Adjarra." />
<link rel="icon" type="image/png" href="/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Instrument+Sans:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="/css/mm.css" />
<link rel="stylesheet" href="/css/mm-pages.css" />
</head>
<body>

<script src="/js/nav.js"></script>

<main>
  <header class="page-head wrap">
    <h1>Les candidats</h1>
    <p class="lede">Découvrez et soutenez les candidat(e)s de l'édition 2027.</p>
  </header>

  <div class="wrap">
    <div class="toolbar">
      <div class="tabs" role="group" aria-label="Catégorie">
        <button class="tab-btn active" data-cat="">Tous</button>
        <button class="tab-btn" data-cat="Miss">Miss</button>
        <button class="tab-btn" data-cat="Mister">Mister</button>
      </div>
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8" stroke-linecap="round"/></svg>
        <input type="search" id="search-input" placeholder="Rechercher par nom ou numéro" aria-label="Rechercher un candidat" />
      </div>
    </div>
    <p class="results-count" id="results-count" role="status"></p>

    <div id="grid" class="cand-grid"></div>
    <div id="empty" class="empty-state" style="display:none;">
      Aucun candidat ne correspond à votre recherche.
    </div>
  </div>
</main>

<!-- Fenêtre de vote -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">Voter</h2>

    <label for="qty">Nombre de votes</label>
    <div class="qty-row">
      <button type="button" id="qty-minus" aria-label="Retirer un vote">−</button>
      <input type="number" id="qty" value="1" min="1" />
      <button type="button" id="qty-plus" aria-label="Ajouter un vote">+</button>
    </div>

    <label for="phone">Numéro de téléphone (Mobile Money)</label>
    <input type="tel" id="phone" placeholder="ex : 97 00 00 00" />

    <div class="total-row">
      <span>Total à payer</span>
      <span class="amount"><span id="total">0</span> FCFA</span>
    </div>

    <button class="btn block" id="pay-btn">Payer et voter</button>
    <div class="error-msg" id="error-msg"></div>
    <span class="close-link" id="close-modal">Annuler</span>
  </div>
</div>

<footer></footer>
<script src="/js/candidats.js"></script>
</body>
</html>
